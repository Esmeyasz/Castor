<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Máscara para telefone (formato brasileiro com DDD)
        function aplicarMascaraTelefone(input) {
            input.addEventListener('input', function () {
                let numero = input.value.replace(/\D/g, '');
                if (numero.length > 11) numero = numero.slice(0, 11);
                let formatado = '';

                if (numero.length > 0) formatado = '(' + numero.substring(0, 2);
                if (numero.length >= 3) formatado += ') ' + numero.substring(2, 7);
                if (numero.length >= 8) formatado += '-' + numero.substring(7);

                input.value = formatado;
            });
        }

        window.onload = function () {
            const telefoneInput = document.querySelector('input[name="telefone"]');
            aplicarMascaraTelefone(telefoneInput);
        };
    </script>
</head>
